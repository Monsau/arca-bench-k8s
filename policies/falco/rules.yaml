# Runtime detection rules for the bench namespace.
- rule: bench Shell Spawned in Container
  desc: Detect shell processes in bench pods
  condition: spawned_process and container and k8s.ns.name=bench and proc.name in (bash, sh)
  output: "Shell spawned in bench (user=%user.name command=%proc.cmdline)"
  priority: WARNING
- rule: bench Sensitive File Read
  desc: Detect reads of sensitive files in bench pods
  condition: open_read and container and k8s.ns.name=bench and fd.name in (/etc/shadow, /etc/sudoers)
  output: "Sensitive file read in bench (user=%user.name file=%fd.name)"
  priority: CRITICAL
