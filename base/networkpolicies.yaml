# Default deny-all, then explicit allowances (zero trust).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arca-bench-bench-deny-all
  namespace: bench
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arca-bench-bench-allow-ingress
  namespace: bench
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arca-bench-bench
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              istio-injection: enabled
      ports:
        - port: 8092
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arca-bench-bench-allow-egress
  namespace: bench
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arca-bench-bench
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arca-bench-platform
      ports:
        - port: 9092
          protocol: TCP
        - port: 443
          protocol: TCP
