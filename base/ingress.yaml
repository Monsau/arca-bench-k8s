apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bench
  namespace: bench
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.platform.svc.cluster.local/oauth2/auth"
spec:
  ingressClassName: nginx
  rules:
    - host: bench.arca.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bench
                port:
                  number: 80
