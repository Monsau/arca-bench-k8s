# Secrets come from Vault through the External Secrets Operator.
# No secret value appears in this repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bench-secrets
  namespace: bench
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bench-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: arca/bench/database
        property: url
    - secretKey: VAULT_ROLE
      remoteRef:
        key: arca/bench/vault
        property: role
