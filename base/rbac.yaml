apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bench
  namespace: bench
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bench
  namespace: bench
subjects:
  - kind: ServiceAccount
    name: bench
    namespace: bench
roleRef:
  kind: Role
  name: bench
  apiGroup: rbac.authorization.k8s.io
