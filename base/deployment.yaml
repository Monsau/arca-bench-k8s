apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench
  namespace: bench
  labels:
    app.kubernetes.io/name: bench
    app.kubernetes.io/part-of: arca-suite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench
        app.kubernetes.io/part-of: arca-suite
    spec:
      serviceAccountName: bench
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: bench
          image: registry.arca.local/arca-bench:0.1.0
          ports:
            - containerPort: 8092
          envFrom:
            - configMapRef:
                name: bench-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bench-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["/app/scripts/healthcheck.sh"]
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8092
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8092
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
